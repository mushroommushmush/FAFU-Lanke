name: Preview app layout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-widgets.yml"
      - "Scripts/CaptureLayout.py"
concurrency:
  group: widget-layout-preview
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift Scripts/RenderIcon.swift
      - name: Build preview app
        run: >-
          xcodebuild -project FAFUCampus.xcodeproj -scheme FAFUCampus
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build
      - name: Capture fresh simulator
        run: python3 Scripts/CaptureLayout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: App-layout-preview
          path: build/layout-preview
          if-no-files-found: warn
          retention-days: 7
